<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso del vendedor · BakeDelivery</title><meta name="description" content="Acceso al panel de administración de BakeDelivery."><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/compartido/img/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/compartido/css/base.css"></head>
<body><main class="contenedor seccion"><div class="tarjeta estrecho"><h1>Panel del vendedor</h1><p class="meta">Acceso solo para personal autorizado.</p>
<form id="form" novalidate>
<div class="campo"><label for="correo">Correo *</label><input id="correo" name="correo" type="email" autocomplete="username" required maxlength="150"><div class="error" id="err-correo" role="alert"></div></div>
<div class="campo"><label for="password">Contraseña *</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="100"><div class="error" id="err-password" role="alert"></div></div>
<button class="btn btn-primario" type="submit">Entrar</button></form><p class="meta"><a href="/">← Volver a la tienda</a></p></div></main>
<script type="module" src="/admin/login.js"></script></body></html>
