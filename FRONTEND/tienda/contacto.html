<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<bd-encabezado></bd-encabezado>
<main id="contenido" tabindex="-1">
<div class="contenedor seccion">
<div class="dos-columnas"><div><h1>Contacto</h1><p>¿Un pastel para un evento grande? ¿Dudas sobre tu pedido? Escríbenos y te respondemos pronto.</p><address id="datos-tienda"></address></div>
<div class="tarjeta"><form id="form" novalidate>
<div class="campo"><label for="nombre">Nombre *</label><input id="nombre" name="nombre" autocomplete="name" required minlength="2" maxlength="100"><div class="error" id="err-nombre" role="alert"></div></div>
<div class="campo"><label for="correo">Correo electrónico *</label><input id="correo" name="correo" type="email" autocomplete="email" required maxlength="150"><div class="error" id="err-correo" role="alert"></div></div>
<div class="campo"><label for="asunto">Asunto *</label><input id="asunto" name="asunto" required minlength="3" maxlength="120"><div class="error" id="err-asunto" role="alert"></div></div>
<div class="campo"><label for="mensaje">Mensaje *</label><textarea id="mensaje" name="mensaje" rows="5" required minlength="10" maxlength="2000"></textarea><div class="error" id="err-mensaje" role="alert"></div></div>
<bd-desafio></bd-desafio>
<div class="campo casilla"><input id="acepta_privacidad" name="acepta_privacidad" type="checkbox" value="1" required><label for="acepta_privacidad">Acepto el <a href="/privacidad" target="_blank" rel="noopener">aviso de privacidad</a>.</label></div><div class="error" id="err-acepta_privacidad" role="alert"></div>
<button class="btn btn-primario" type="submit">Enviar mensaje</button></form></div></div>
</div>
</main>
<bd-pie></bd-pie>
<bd-cookies></bd-cookies>
